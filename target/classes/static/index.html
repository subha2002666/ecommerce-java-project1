<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSphere | E-Commerce</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
    <a class="brand" href="/">ShopSphere</a>
    <div class="nav-links">
        <a href="/">Products</a>
        <a href="/cart.html">Cart <span id="cartCount">0</span></a>
        <a href="/orders.html">Orders</a>
        <a href="/login.html" id="loginLink">Login</a>
        <a href="/admin.html">Admin</a>
    </div>
</header>

<main class="container">
    <section class="hero">
        <div>
            <p class="eyebrow">JAVA + SPRING BOOT E-COMMERCE</p>
            <h1>Everything you need.<br><span>One simple shop.</span></h1>
            <p>Browse products, manage your cart and place orders through a real REST API.</p>
        </div>
    </section>

    <section class="toolbar">
        <input id="search" type="search" placeholder="Search products...">
        <select id="category">
            <option value="">All categories</option>
            <option>Electronics</option>
            <option>Fashion</option>
            <option>Accessories</option>
        </select>
        <button onclick="loadProducts()">Search</button>
    </section>

    <section id="products" class="grid"></section>
</main>
<script src="/js/app.js"></script>
</body>
</html>
