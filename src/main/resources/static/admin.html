<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | ShopSphere</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="navbar">
<a class="brand" href="/">ShopSphere Admin</a>
<div class="nav-links"><a href="/">Store</a><a href="/orders.html">Orders</a></div>
</header>
<main class="container">
<h1>Product Management</h1>
<form id="productForm" class="admin-form">
<input id="pname" placeholder="Product name" required>
<input id="price" type="number" step="0.01" placeholder="Price" required>
<input id="stock" type="number" placeholder="Stock" required>
<input id="category" placeholder="Category" required>
<input id="imageUrl" placeholder="Image URL">
<textarea id="description" placeholder="Description"></textarea>
<button type="submit">Add Product</button>
</form>
<div id="adminProducts" class="grid"></div>
</main>
<script src="/js/app.js"></script>
<script>loadAdminProducts();</script>
</body>
</html>
